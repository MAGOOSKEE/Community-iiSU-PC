name: Build Installer

# windows-latest, not ubuntu: this produces a Windows installer, and the
# build scripts it runs (build_jre.py, build_embedded_python.py) shell
# out to Windows-specific tooling (jlink, an embeddable CPython zip built
# for win-amd64, ISCC.exe) same as tests.yml is windows-latest for the
# app itself importing cleanly only on Windows.
#
# Deliberately its own workflow, not folded into tests.yml: this job
# takes several minutes (JDK setup, two runtime downloads, an LZMA
# compile of the whole bundle) and isn't relevant to every push the way
# the unit tests are, so it only runs when someone actually wants an
# installer built, a version tag, or a manual dispatch to try one out
# before cutting a real release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build-installer:
    runs-on: windows-latest
    # contents: write is needed for the release step below (creating a
    # release + uploading its asset) on a tag push; it's a no-op
    # permission on a plain workflow_dispatch run, which never reaches
    # that step.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The installer's filename and the in-app updater both take their
      # version from VERSION, not from the tag, so a tag that disagrees with
      # it would publish an installer named for a different release than
      # the one users are told they got. Fail before building anything.
      - name: Check the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -TotalCount 1).Trim()
          if ($version -ne $env:GITHUB_REF_NAME) {
            Write-Error "Tag $env:GITHUB_REF_NAME does not match VERSION ($version). Bump VERSION or retag."
            exit 1
          }

      # Same checks tests.yml runs on pushes, repeated here so a tag can't
      # publish an installer built from a tree the tests never saw.
      - name: Compile-check every source file
        run: python -m compileall -q bridge installer shared tests

      - name: Run unit tests
        run: python -m unittest discover -s tests

      # Temurin 21, matching the JDK this was developed and verified
      # against (see installer/build_jre.py), any recent JDK works,
      # jlink's module detection is mechanical (jdeps against
      # apktool.jar), not tied to a specific vendor/version.
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # windows-latest runners ship Chocolatey preinstalled; this is the
      # standard way to get ISCC.exe onto a fresh runner without a manual
      # download step.
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build trimmed JRE
        run: python installer/build_jre.py

      - name: Build embedded Python runtime
        run: python installer/build_embedded_python.py

      - name: Compile installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\CommunityIisuPC.iss
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/installer/*.exe
          if-no-files-found: error

      # Only on an actual version tag, workflow_dispatch runs (used to
      # try a build without cutting a release) stop at the artifact
      # upload above.
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*.exe
          generate_release_notes: true
          # Tags with a suffix (v0.5.3-alpha, v1.0.0-rc1) publish as
          # pre-releases, matching how every release here has been cut by
          # hand, and which is what the in-app updater expects (it reads the
          # full releases list, not /releases/latest, which skips them).
          # GitHub never labels a pre-release "Latest", so that label
          # stays on the last plain release by design.
          prerelease: ${{ contains(github.ref_name, '-') }}
