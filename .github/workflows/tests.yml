name: Tests

# windows-latest, not ubuntu: bridge/winapi.py (and everything that
# imports it, launch_bridge.py, the Manager pages, onboarding_wizard.py, ...)
# uses ctypes.windll at import time, so this project only imports
# cleanly on Windows in the first place, same as it only ever runs on
# Windows.
on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Catches a plain syntax error in any file the small tests/ suite
      # doesn't happen to import (the installer/ GUI files and the dialogs
      # aren't exercised by any test below), before it ships to someone's
      # machine as a release.
      - name: Compile-check every source file
        run: python -m compileall -q bridge installer shared tests

      # The one Qt smoke test (tests/test_ui_smoke.py) skips itself without
      # PySide6; the app needs it anyway, so install it to actually run it.
      - name: Install PySide6
        run: python -m pip install PySide6-Essentials

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
