name: Tests

# windows-latest: the Windows half of the code (bridge/winapi_windows.py,
# the XInput controller bridge, the WinMM audio player) only imports there,
# and Windows is where most installs are. The Linux half is covered by the
# tests that take the platform as a parameter; a Linux job that runs the
# suite for real would be a welcome addition.
on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Catches a plain syntax error in any file the small tests/ suite
      # doesn't happen to import (the installer/ GUI files and the dialogs
      # aren't exercised by any test below), before it ships to someone's
      # machine as a release.
      - name: Compile-check every source file
        run: python -m compileall -q bridge installer shared tests

      # The one Qt smoke test (tests/test_ui_smoke.py) skips itself without
      # PySide6; the app needs it anyway, so install it to actually run it.
      - name: Install PySide6
        run: python -m pip install PySide6-Essentials

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
